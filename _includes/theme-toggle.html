<button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme">
  <svg class="icon-auto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"></circle>
    <path d="M12 3a9 9 0 0 0 0 18"></path>
    <path d="M12 3v18" fill="currentColor" stroke="none"></path>
    <path d="M3 12h9" stroke="none" fill="currentColor"></path>
  </svg>
  <svg class="icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4"></circle>
    <path d="M12 2v2"></path><path d="M12 20v2"></path>
    <path d="M4.93 4.93l1.41 1.41"></path><path d="M17.66 17.66l1.41 1.41"></path>
    <path d="M2 12h2"></path><path d="M20 12h2"></path>
    <path d="M4.93 19.07l1.41-1.41"></path><path d="M17.66 6.34l1.41-1.41"></path>
  </svg>
  <svg class="icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
</button>
<script>
  (function() {
    var btn = document.getElementById('theme-toggle');
    if (!btn) return;
    var order = ['auto', 'light', 'dark'];
    btn.addEventListener('click', function() {
      var current = document.documentElement.getAttribute('data-theme-pref') || 'auto';
      var next = order[(order.indexOf(current) + 1) % order.length];
      try { localStorage.setItem('theme', next); } catch (e) {}
      var resolved = next;
      if (next === 'auto') {
        resolved = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', resolved);
      document.documentElement.setAttribute('data-theme-pref', next);
      btn.setAttribute('aria-pressed', next !== 'auto');
    });
    /* react to OS preference changes while in auto mode */
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          if ((document.documentElement.getAttribute('data-theme-pref') || 'auto') === 'auto') {
            document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
          }
        });
      }
    }
  })();
</script>
