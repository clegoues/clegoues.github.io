# Rules for inferring `pubtype` and `abbrv` on the personal site from a
# lab-side bibtex entry.
#
# Used by bin/sync_publications.py.
#
# Each rule has a `match` block and a `set` block. The transformer walks
# rules in order; the FIRST match wins.
#
# match fields:
#   entry_type:           one BibTeX entry type, or a list of them
#                         (article, inproceedings, book, inbook, proceedings)
#   booktitle_via:        name of a lookup table (below). The rule matches
#                         if any key in that table is a substring of the
#                         entry's `booktitle` (or `journal`, for @article).
#                         The matched value is also used as the abbrv unless
#                         `set.abbrv` or `set.abbrv_from` overrides.
#   booktitle_also_any:   optional list of extra literal substrings that
#                         also trigger this rule (catch-all phrases like
#                         "Workshop" or "Industry Track"). No abbrv side
#                         effect; just additional triggers.
#
# set fields:
#   pubtype:              literal value to assign (0=full, 1=short, 2=wacky)
#   abbrv:                literal value to assign
#   abbrv_from:           same name semantics as booktitle_via; takes the
#                         FIRST table-key whose substring appears in the
#                         entry's booktitle/journal, returns that table value
#                         as the abbrv.
#
# String matching is whitespace- and punctuation-tolerant: braces, commas,
# parentheses, slashes, periods, etc. don't matter. See `_flat()` in the
# transformer.

rules:
  # Workshops — fires if any workshop_map key matches OR a catch-all
  # phrase appears. Same rule for @inproceedings and @article (the lab
  # occasionally uses @article for workshop registered-reports).
  - match:
      entry_type: [inproceedings, article]
      booktitle_via: workshop_map
      booktitle_also_any:
        - "Workshop"
        - "@ICSE"
        - "@SPLASH"
        - "@FSE"
        - "NIER"
        - "DSN-W"
    set:
      pubtype: 1
      abbrv_from: workshop_map

  # Short tracks / industry / posters / supplemental volumes.
  - match:
      entry_type: inproceedings
      booktitle_via: short_track_map
      booktitle_also_any:
        - "Industry Track"
        - "Demonstration"
        - "Tools Track"
        - "Doctoral"
        - "Companion"
        - "Supplemental"
        - "Late-Breaking"
        - "Poster"
        - "Short Paper"
    set:
      pubtype: 1
      abbrv_from: short_track_map

  # @article entries with a conference-style booktitle (USENIX Security
  # papers and a few FSE entries that the lab marks @article). Must come
  # before the journal default.
  - match:
      entry_type: article
      booktitle_via: conference_map
    set:
      pubtype: 0
      abbrv_from: conference_map

  # Default for @article: it's a journal.
  - match:
      entry_type: article
    set:
      pubtype: 0
      abbrv_from: journal_map

  # Books / chapters / proceedings.
  - match: { entry_type: inbook }
    set:   { pubtype: 0, abbrv: "Book Chapter" }
  - match: { entry_type: book }
    set:   { pubtype: 0, abbrv: "Edited Volume" }
  - match: { entry_type: proceedings }
    set:   { pubtype: 0, abbrv: "Proceedings" }

  # Default: full conference paper.
  - match:
      entry_type: inproceedings
    set:
      pubtype: 0
      abbrv_from: conference_map


# ============================================================================
# Lookup tables
# ============================================================================
# Each table maps a phrase (substring of booktitle/journal) to the abbrv.
# Matching is whitespace-tolerant and punctuation-tolerant — write canonical
# phrases without worrying about commas, braces, line wraps.
#
# Order matters: more-specific phrases first. The first key whose substring
# appears in the haystack wins.

journal_map:
  "Transactions on Software Engineering Methodology": "TOSEM"
  "Trans Softw Eng Methodol": "TOSEM"
  "Transactions on Software Engineering": "TSE"
  "Trans Software Eng": "TSE"
  "Communications of the ACM": "CACM"
  "Commun ACM": "CACM"
  "Empirical Software Engineering": "EMSE"
  "Empir Softw Eng": "EMSE"
  "IEEE Software": "IEEE Software"
  "IEEE Softw": "IEEE Software"
  "Software Quality Journal": "SQJ"
  "Trans Auton Adapt Syst": "TAAS"
  "Autonomous Agents and Multi-Agent Systems": "AAMAS"
  "Genetic Programming and Evolvable Machines": "GPEM"

conference_map:
  # ".ISSTA" / ".FSE" catch the lab's `Proc ACM Softw Eng 2 ISSTA` dialect
  # — they're prefixed with a period (post-normalization, a space) and need
  # to land before the broader phrases.
  " ISSTA": "ISSTA"
  " FSE": "FSE"
  "European Software Engineering Conference": "ESEC/FSE"
  "Foundations of Software Engineering": "FSE"
  "International Conference on Software Engineering": "ICSE"
  "Symposium on Software Testing and Analysis": "ISSTA"
  "Automated Software Engineering": "ASE"
  "Software Analysis Evolution and Reengineering": "SANER"
  "Software Maintenance and Evolution": "ICSME"
  "USENIX Security": "USENIX Sec."
  "Network and Distributed System Security": "NDSS"
  "Software Reliability Engineering": "ISSRE"
  "Dependable Systems and Networks": "DSN"
  "Robotics and Automation": "ICRA"
  "Software Testing Verification": "ICST"
  "Software Testing": "ICST"
  "Programming Language Design and Implementation": "PLDI"
  "Compiler Construction": "CC"
  "Mining Software Repositories": "MSR"
  "Genetic and Evolutionary Computation": "GECCO"
  "Search Based Software Engineering": "SSBSE"
  "Software Architecture": "ICSA"
  "Detection of Intrusions and Malware": "DIMVA"
  "Formal Methods and Models for System Design": "MEMOCODE"
  "Software Engineering and Formal Methods": "SEFM"
  "Program Comprehension": "ICPC"
  "Software Engineering for Adaptive and Self-Managing Systems": "SEAMS"
  "Self-Adaptive and Self-Managing Systems": "SEAMS"
  "Autonomic Computing and Self-Organizing": "ACSOS"
  "Self-Organizing Systems": "ACSOS"
  "Computer Security Applications": "ACSAC"
  "Summit on Advances in Programming Languages": "SNAPL"
  "Architectural Support for Programming Languages and Operating Systems": "ASPLOS"
  "SIGPLAN": "PLDI"

workshop_map:
  "LLM4Code": "LLM4Code"
  "Deep Learning for Code": "DL4C"
  "Bots in Software Engineering": "BotSE"
  "BotSE": "BotSE"
  "DSN Workshop": "DSN-W"
  "Future of Software Engineering": "FoSER"
  "FoSER": "FoSER"
  "ICSE-NIER": "ICSE NIER"
  "Genetic Improvement": "GI"
  "GI '": "GI"
  "Conference on Automation of Software Test": "AST"
  "AST@ICSE": "AST"
  "AAAI Workshop": "AAAI Workshop"
  "Fuzzing Workshop": "FUZZING"
  "Fuzzing": "FUZZING"

short_track_map:
  "ICSE-SEIP": "ICSE SEIP"
  "SEIP": "SEIP"
  "Industry Track": "Industry"
  "Demonstration": "Demo"
  "Tools Track": "Tools"
  "Doctoral": "Doctoral"
  "MSR Challenge": "MSR Challenge"
  "DSN-S": "DSN-S"
  "Supplemental Volume": "DSN-S"
  "Poster": "Poster"
  "Companion": "Companion"
  "Late-Breaking": "Late-Breaking"
